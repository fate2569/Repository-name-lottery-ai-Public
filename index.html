<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>排列三AI预测</title>
</head>

<body style="text-align:center;font-family:sans-serif">

<h2>🎯 排列三智能预测</h2>

<button onclick="run('freq')">🔥 频率模型</button>
<button onclick="run('trend')">📈 趋势模型</button>
<button onclick="run('rf')">🤖 随机森林</button>

<h3 id="out"></h3>

<script>
async function run(model){
    let res = await fetch("/predict?model="+model);
    let data = await res.json();
    document.getElementById("out").innerText =
        "预测结果: " + data.result.join(" ");
}
</script>

</body>
</html>
